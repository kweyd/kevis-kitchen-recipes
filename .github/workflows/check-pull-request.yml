name: Check recipes
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_recipes.py
      - run: python3 scripts/build_index.py
      - name: Only recipe files changed
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          outside=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD -- . ':!recipes/' ':!images/' ':!index.json')
          if [ -n "$outside" ]; then
            echo "::warning::This pull request also changes files outside recipes/ and images/:"
            echo "$outside"
          fi
