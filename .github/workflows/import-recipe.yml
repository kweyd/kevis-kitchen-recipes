name: Import recipe
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  import:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Create recipe files
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python scripts/issue_to_recipe.py && python scripts/build_index.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recipes images index.json
          git commit -m "Add recipe from #${{ github.event.issue.number }}"
          git push
      - run: gh issue close ${{ github.event.issue.number }} --comment "Thanks! Your recipe is published 🎉"
        env:
          GH_TOKEN: ${{ github.token }}
